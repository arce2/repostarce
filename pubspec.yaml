




name: repostarce
description: "Gasly: encuentra la gasolinera más barata cerca de ti y navega hasta ella."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Mapa (OpenStreetMap) y tipo de coordenadas compartido por todo el proyecto.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Agrupa en un círculo las gasolineras muy juntas en el mapa (si no, se
  # tapan unas a otras en zonas densas y parecen "desaparecer").
  flutter_map_marker_cluster: ^1.4.0

  # GPS del dispositivo (posición actual + stream en vivo durante la navegación).
  geolocator: ^13.0.2

  # Llamadas HTTP a la API de precios de carburantes y al servicio de rutas.
  http: ^1.2.2

  # Persistencia local sencilla (gasolineras favoritas, histórico de
  # precios) entre sesiones.
  shared_preferences: ^2.3.2

  # Notificaciones locales del dispositivo cuando baja el precio de una
  # favorita.
  flutter_local_notifications: ^18.0.1

  # Selector de idioma (español / inglés / francés).
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # Widget de pantalla de inicio con la gasolinera más barata (Android;
  # en iOS necesita además un target de Widget nativo hecho en Xcode/Mac,
  # ver README).
  home_widget: ^0.10.0

  # Copia de seguridad: exportar todos los datos locales a un archivo y
  # compartirlo (share_plus). path_provider da el directorio temporal donde
  # escribir el archivo antes de compartirlo. La importacion se hace
  # pegando el contenido del archivo (sin selector de archivos: el plugin
  # file_picker trae un compileSdk desactualizado en su propio codigo,
  # incompatible con el SDK de Android que exige el resto de plugins).
  share_plus: ^10.0.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Genera el icono de la app para Android e iOS a partir de assets/icon/.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
