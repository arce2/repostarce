




name: repostarce
description: "Encuentra la gasolinera más barata cerca de ti y navega hasta ella."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Mapa (OpenStreetMap) y tipo de coordenadas compartido por todo el proyecto.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Agrupa en un círculo las gasolineras muy juntas en el mapa (si no, se
  # tapan unas a otras en zonas densas y parecen "desaparecer").
  flutter_map_marker_cluster: ^1.4.0

  # GPS del dispositivo (posición actual + stream en vivo durante la navegación).
  geolocator: ^13.0.2

  # Llamadas HTTP a la API de precios de carburantes y al servicio de rutas.
  http: ^1.2.2

  # Persistencia local sencilla (gasolineras favoritas, histórico de
  # precios) entre sesiones.
  shared_preferences: ^2.3.2

  # Notificaciones locales del dispositivo cuando baja el precio de una
  # favorita.
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Genera el icono de la app para Android e iOS a partir de assets/icon/.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0F7A4E"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
